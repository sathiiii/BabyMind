[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "babymind"
version = "0.1.0"
description = "Object-first inductive biases for grounding language in child-view video"
readme = "README.md"
requires-python = ">=3.8,<3.11"
license = {text = "MIT"}
authors = [
  {name = "Sathira Silva"}
]
dependencies = [
  "torch==2.4.0",
  "torchvision==0.19.0",
  "numpy==1.24.4",
  "scipy==1.10.1",
  "matplotlib==3.7.5",
  "opencv-python==4.9.0.80",
  "pandas==2.0.3",
  "pillow==10.3.0",
  "pytorch-lightning==1.6.0",
  "torchinfo==1.8.0",
  "spacy==3.7.4",
  "huggingface-hub>=0.28.1",
  "transformers>=4.40,<5",
  "tqdm>=4.66",
  "imageio>=2.34",
  "wandb==0.16.5",
  "pycocoevalcap==1.2",
  "gsheets==0.6",
  "ftfy>=6.1",
  "regex>=2023.0.0"
]

[project.optional-dependencies]
masking = [
  "segment-anything @ git+https://github.com/facebookresearch/segment-anything.git",
  "clip @ git+https://github.com/openai/CLIP.git"
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5"
]

[tool.setuptools.packages.find]
include = ["multimodal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
